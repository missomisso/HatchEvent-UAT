name: HatchEvent UAT

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which tests to run'
        required: true
        default: 'all'
        type: choice
        options: [all, eo, vendor, rfq, svc, access, validation, bugs, health, writes]
      write_flows:
        description: 'Also re-save the RSVP design (WR-TC-03/04)?'
        required: true
        default: 'off'
        type: choice
        options: ['off', 'rsvp']
  schedule:
    - cron: '0 19 * * 0-4'   # Sun–Thu 19:00 UTC = Mon–Fri 03:00 SGT

jobs:
  run-uat:
    name: Run Playwright UAT
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_URL:        ${{ secrets.BASE_URL }}
      EO_EMAIL:        ${{ secrets.EO_EMAIL }}
      EO_PASSWORD:     ${{ secrets.EO_PASSWORD }}
      VENDOR_EMAIL:    ${{ secrets.VENDOR_EMAIL }}
      VENDOR_PASSWORD: ${{ secrets.VENDOR_PASSWORD }}
      WRITE_FLOWS:     ${{ github.event.inputs.write_flows == 'rsvp' && 'rsvp' || '' }}
      TESTER_NAME:     'Laurent Misso (CI)'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
          pip install openpyxl

      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        run: |
          SUITE="${{ github.event.inputs.suite || 'all' }}"
          if [ "$SUITE" = "all" ]; then npm test; else npm run "test:$SUITE"; fi

      - name: Log results + build test catalogue
        if: always()
        run: |
          if [ ! -f results/results.json ]; then echo "::warning::No results.json"; exit 0; fi
          python3 update_tracker.py results/results.json          # → HatchEvent_Playwright_Runs.xlsx (table: PlaywrightRuns)
          python3 scripts/build_catalogue.py results/results.json

      - name: Sync results to ClickUp (Test Cases, Bug Log, Test Runs)
        if: always()
        continue-on-error: true   # never block the test job
        env:
          CLICKUP_TOKEN:        ${{ secrets.CLICKUP_TOKEN }}
          CLICKUP_TEST_LIST_ID: '1100330000207979'
          CLICKUP_BUG_LIST_ID:  '1100330000207139'
          CLICKUP_RUNS_LIST_ID: '1100330000208806'
        run: python3 scripts/clickup_sync.py results/results.json

      - name: Upload run results + catalogue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HatchEvent-UAT-Tracker-${{ github.run_number }}   # name kept for the Power Automate flow
          path: |
            HatchEvent_Playwright_Runs.xlsx
            HatchEvent_UAT_Test_Catalogue.xlsx
          if-no-files-found: warn
          retention-days: 90

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: results/html-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Run summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from collections import Counter
          if not os.path.exists('results/results.json'):
              print('No results'); raise SystemExit
          from update_tracker import load
          rows = load('results/results.json'); c = Counter(r['result'] for r in rows)
          print(f"## HatchEvent UAT — run #{os.environ.get('GITHUB_RUN_NUMBER')}\n")
          print('| Result | Count |\n|---|---|')
          for k in ['Pass','Pass (flaky)','Fail','Known Bug','Fixed? Re-test','Manual','Skipped']:
              print(f'| {k} | {c.get(k,0)} |')
          bad = [r for r in rows if r['result'] in ('Fail','Fixed? Re-test')]
          if bad:
              print('\n### Needs attention')
              for r in bad: print(f"- **{r['tc']}** {r['scenario']} — {r['result']}")
          print('\nDownload the run results, catalogue and HTML report from **Artifacts** above.')
          PY

      - name: Fail the job if any test failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
