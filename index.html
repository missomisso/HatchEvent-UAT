<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=./docs/" />
    <title>HatchEvent UAT</title>
    <meta
      name="description"
      content="Redirecting to the current HatchEvent UAT testing dashboard."
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #07131f;
        --panel: #0d1f2d;
        --accent: #1ec7a6;
        --text: #edf6ff;
        --muted: #a7bccd;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #123a53, var(--bg) 48%);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }
      .card {
        background: rgba(13, 31, 45, 0.9);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        padding: 2rem 2.25rem;
        text-align: center;
        box-shadow: 0 18px 48px rgba(0,0,0,0.18);
      }
      .badge {
        display: inline-block;
        padding: 0.38rem 0.7rem;
        border-radius: 999px;
        background: rgba(30, 199, 166, 0.12);
        color: var(--accent);
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 1rem;
      }
      a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      p {
        margin: 0.65rem 0 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">HatchEvent UAT</div>
      <h1>Redirecting to the live dashboard…</h1>
      <p>
        If you are not redirected automatically,
        <a href="./docs/">open the current UAT dashboard</a>.
      </p>
    </div>
  </body>
</html>
